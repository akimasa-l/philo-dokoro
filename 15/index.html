<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>🎵 クラシック音楽ガチャ</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --void:#030310;--deep:#07071c;--mid:#0d0d2a;--surface:#141438;
  --gold:#f0c040;--gold-lt:#fff4b0;--gold-dm:#806010;--gold-glow:rgba(240,192,64,.45);
  --silver:#b8cce0;--silver-glow:rgba(184,204,224,.45);
  --bronze:#c8844a;--bronze-glow:rgba(200,132,74,.4);
  --red:#cc2200;
  --text:#ede0c4;--text-d:#a09070;--text-m:#604840;
  --ssr1:#180e00;--ssr2:#2c1a00;--ssrb:#f0c040;--ssrg:rgba(240,192,64,.65);
  --sr1:#00101c;--sr2:#001c30;--srb:#80aedd;--srg:rgba(128,174,221,.55);
  --r1:#0e0010;--r2:#18001e;--rb:#9060aa;--rg:rgba(144,96,170,.4);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:'Noto Serif JP',serif}

/* ── CANVAS ── */
#bgC{position:fixed;inset:0;z-index:0;pointer-events:none}
#ptC{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s}
#ptC.on{opacity:1}

/* ── SCREENS ── */
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .5s ease}
.scr.on{opacity:1;pointer-events:all}

/* ════════════════════════════════
   MAIN SCREEN
════════════════════════════════ */
#sMain{
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%,#1a1050 0%,transparent 100%),
    radial-gradient(ellipse 60% 30% at 50% 100%,#0e0820 0%,transparent 100%),
    var(--void);
  padding-bottom:30px
}

/* header */
.mHdr{width:100%;padding:52px 20px 12px;text-align:center}
.mDeco{font-size:11px;color:var(--gold-dm);letter-spacing:3px;margin:5px 0}
.mTitle{display:flex;flex-direction:column;align-items:center;gap:3px}
.mT1{font-family:'Cinzel',serif;font-size:11px;font-weight:600;letter-spacing:9px;color:var(--gold);text-transform:uppercase}
.mT2{font-family:'Noto Serif JP',serif;font-size:33px;font-weight:700;
  background:linear-gradient(140deg,#fff8e0 0%,var(--gold) 40%,#fff4a0 70%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 12px rgba(240,192,64,.5))}

/* banner */
.banner{width:calc(100% - 28px);max-width:400px;margin:14px auto;border-radius:14px;overflow:hidden;
  border:1px solid rgba(240,192,64,.25);box-shadow:0 0 28px rgba(240,192,64,.08),inset 0 0 28px rgba(0,0,0,.4)}
.bArt{height:186px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#08051e 0%,#130930 50%,#08051a 100%)}

/* concert-hall CSS art */
.bFloor{position:absolute;bottom:0;left:0;right:0;height:40px;
  background:linear-gradient(180deg,#1a0c04,#0d0802);border-top:1px solid #3a2010}
.bStage{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:160px;height:10px;
  background:linear-gradient(90deg,#2a1808,#4a2a10,#2a1808);border-radius:6px 6px 0 0;
  box-shadow:0 -4px 16px rgba(240,180,80,.15)}
.bPodium{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);width:22px;height:18px;
  background:linear-gradient(135deg,#3a2010,#604020);border-radius:3px 3px 0 0}
.bPodium::before{content:'𝄞';position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  font-size:32px;color:rgba(240,200,90,.85);filter:drop-shadow(0 0 8px rgba(240,200,90,.8));
  animation:clefFloat 2.4s ease-in-out infinite}
@keyframes clefFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.bCurtL,.bCurtR{position:absolute;top:0;width:30%;height:100%;overflow:hidden}
.bCurtL{left:0;background:linear-gradient(90deg,#4a0a0a,#6e1212,#3a0808)}
.bCurtR{right:0;background:linear-gradient(270deg,#4a0a0a,#6e1212,#3a0808)}
.bCurtL::after,.bCurtR::after{content:'';position:absolute;top:0;bottom:0;width:18px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.bCurtL::after{right:0}.bCurtR::after{left:0}
.bSpot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:100%;
  background:linear-gradient(180deg,rgba(255,240,170,.14) 0%,transparent 100%);
  clip-path:polygon(18% 0%,82% 0%,100% 100%,0% 100%);
  animation:spotP 3s ease-in-out infinite}
@keyframes spotP{0%,100%{opacity:.75}50%{opacity:1}}
.bArch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:80px;
  border:1px solid rgba(240,180,60,.12);border-bottom:none;border-radius:100px 100px 0 0}
.bNotes{position:absolute;inset:0;pointer-events:none}
.bn{position:absolute;font-size:18px;color:rgba(240,200,90,.55);animation:bnF 4s ease-in-out infinite}
.bn1{left:16%;top:58%;animation-delay:0s}.bn2{left:28%;top:32%;animation-delay:.6s}
.bn3{left:62%;top:48%;animation-delay:1.1s}.bn4{left:77%;top:28%;animation-delay:1.7s}
.bn5{left:88%;top:62%;animation-delay:2.2s}
@keyframes bnF{0%,100%{transform:translateY(0) rotate(-6deg);opacity:.55}50%{transform:translateY(-9px) rotate(6deg);opacity:.9}}
.bOvl{position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(4,2,18,.8));padding:22px 16px 12px;text-align:center}
.bLbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:var(--gold);margin-bottom:3px}
.bTtl{font-size:17px;font-weight:700;color:var(--text)}
.bSub{font-size:11px;color:var(--text-d);margin-top:1px}

/* featured marquee */
.featWrap{width:calc(100% - 28px);max-width:400px;margin:6px auto;overflow:hidden;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 12px}
.featInner{white-space:nowrap;animation:marquee 20s linear infinite;font-size:12px;color:var(--text-d)}
.featInner span{margin-right:40px}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* rates */
.rates{display:flex;align-items:center;justify-content:center;gap:14px;
  padding:9px 20px;margin:8px auto;
  background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:8px;
  max-width:calc(100% - 28px)}
.rItem{display:flex;flex-direction:column;align-items:center;gap:1px}
.rStar{font-size:10px}.rPct{font-family:'Cinzel',serif;font-size:13px;font-weight:700}
.rItem.ssr .rStar{color:var(--gold)}.rItem.ssr .rPct{color:var(--gold)}
.rItem.sr .rStar{color:var(--silver)}.rItem.sr .rPct{color:var(--silver)}
.rItem.r .rStar{color:var(--bronze)}.rItem.r .rPct{color:var(--bronze)}
.rDiv{color:rgba(255,255,255,.18);font-size:18px}

/* pull buttons */
.pullBtns{display:flex;flex-direction:column;gap:13px;width:calc(100% - 28px);max-width:400px;margin:12px auto}
.pBtn{width:100%;height:66px;border:none;border-radius:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;transition:transform .14s}
.pBtn:active{transform:scale(.963)}
.pBtn1{background:linear-gradient(135deg,#1e1000,#3a2000,#241400);
  border:1.5px solid var(--gold);box-shadow:0 0 22px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.08)}
.pBtn10{background:linear-gradient(135deg,#00091a,#001628,#000d1e);
  border:1.5px solid var(--silver);box-shadow:0 0 22px var(--silver-glow),inset 0 1px 0 rgba(255,255,255,.08)}
.pBtn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 50%);pointer-events:none}
.pBtn::after{content:'';position:absolute;inset:0 -100% 0 -100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
  animation:shim 2.5s ease-in-out infinite}
@keyframes shim{0%,100%{transform:translateX(-100%)}60%{transform:translateX(100%)}}
.pIcon{font-size:22px;animation:ibounce 1.2s ease-in-out infinite}
@keyframes ibounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pTxt{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700}
.pCnt{font-family:'Cinzel',serif;font-size:12px;color:var(--text-d)}
.pBtn1 .pTxt{background:linear-gradient(90deg,#fff8dc,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pBtn10 .pTxt{background:linear-gradient(90deg,#ffffff,var(--silver));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gNote{text-align:center;font-size:11px;color:var(--text-d);margin:2px 20px}
.mFoot{text-align:center;padding:18px 20px;font-size:11px;color:var(--text-m);font-style:italic;margin-top:auto}

/* ════════════════════════════════
   PULL ANIMATION SCREEN
════════════════════════════════ */
#sPull{background:#00000c;justify-content:center;align-items:center}
.pullWrap{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.o4,.o3,.o2,.o1{position:absolute;border-radius:50%;animation:oP 1.4s ease-in-out infinite}
.o4{width:140px;height:140px;border:1px solid rgba(240,192,64,.25);background:radial-gradient(circle,transparent 35%,rgba(240,192,64,.07));animation-delay:.25s}
.o3{width:95px;height:95px;border:1px solid rgba(240,192,64,.45);background:radial-gradient(circle,rgba(240,192,64,.18),transparent)}
.o2{width:55px;height:55px;border:1px solid rgba(255,224,110,.8);background:radial-gradient(circle,rgba(255,220,90,.55),rgba(240,192,64,.15));animation-delay:.12s}
.o1{width:22px;height:22px;background:radial-gradient(circle,#fff,rgba(255,230,140,.9));
  box-shadow:0 0 22px #fff,0 0 45px rgba(240,192,64,.9)}
@keyframes oP{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.18);opacity:1}}
.rays{position:absolute;width:300px;height:300px;animation:rRot 5s linear infinite}
.ray{position:absolute;top:50%;left:50%;height:1.5px;width:120px;transform-origin:left center;
  transform:rotate(var(--a));
  background:linear-gradient(90deg,rgba(240,192,64,.85),transparent);
  animation:rayF 1.4s ease-in-out infinite}
@keyframes rRot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rayF{0%,100%{opacity:0;width:80px}50%{opacity:.85;width:130px}}
.pullNotes{position:absolute;inset:0;pointer-events:none}
.pn{position:absolute;font-size:22px;color:rgba(240,200,90,.7);
  animation:pnFly 3s ease-in-out infinite}
.pullMsg{position:absolute;bottom:-56px;width:100%;text-align:center;
  font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:rgba(240,192,64,.7);
  animation:msgPulse 1.6s ease-in-out infinite}
@keyframes pnFly{0%,100%{opacity:0;transform:translateY(0) scale(.8)}50%{opacity:.8;transform:translateY(-30px) scale(1)}}
@keyframes msgPulse{0%,100%{opacity:.6}50%{opacity:1}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s;z-index:200}
.flash.on{opacity:1}

/* ════════════════════════════════
   RESULT SCREEN
════════════════════════════════ */
#sRes{
  background:
    radial-gradient(ellipse 70% 35% at 50% 0%,#160c34 0%,transparent 100%),
    var(--void);
  padding-bottom:40px
}
.resHdr{width:100%;text-align:center;padding:52px 20px 14px}
.resHdr h2{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:var(--gold)}
.resHdr p{font-size:11px;color:var(--text-d);margin-top:4px}

.rView{display:none;width:100%;flex-direction:column;align-items:center;gap:16px}
.rView.on{display:flex}

/* ── GACHA CARD ── */
.gCard{width:284px;min-height:408px;border-radius:16px;position:relative;overflow:hidden;
  opacity:0;transform:rotateY(-90deg) scale(.85);
  animation:cardIn .65s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes cardIn{to{opacity:1;transform:rotateY(0deg) scale(1)}}

.gCard.r5{background:linear-gradient(155deg,var(--ssr1) 0%,var(--ssr2) 45%,var(--ssr1) 100%);
  border:2px solid var(--ssrb);box-shadow:0 0 32px var(--ssrg),0 0 65px rgba(240,192,64,.18)}
.gCard.r4{background:linear-gradient(155deg,var(--sr1) 0%,var(--sr2) 45%,var(--sr1) 100%);
  border:2px solid var(--srb);box-shadow:0 0 30px var(--srg),0 0 60px rgba(128,174,221,.15)}
.gCard.r3{background:linear-gradient(155deg,var(--r1) 0%,var(--r2) 45%,var(--r1) 100%);
  border:2px solid var(--rb);box-shadow:0 0 20px var(--rg)}

/* card shine sweep */
.gCard::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 55%);pointer-events:none;z-index:1}

/* card top */
.cTop{padding:11px 14px 7px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.cStars{font-size:14px;letter-spacing:2px}
.r5 .cStars{color:var(--gold)}.r4 .cStars{color:var(--silver)}.r3 .cStars{color:var(--bronze)}
.cBadge{font-family:'Cinzel',serif;font-size:8px;padding:3px 9px;border-radius:10px;letter-spacing:.8px}
.r5 .cBadge{background:rgba(240,192,64,.18);border:1px solid rgba(240,192,64,.38);color:var(--gold)}
.r4 .cBadge{background:rgba(128,174,221,.18);border:1px solid rgba(128,174,221,.38);color:var(--silver)}
.r3 .cBadge{background:rgba(144,96,170,.18);border:1px solid rgba(144,96,170,.38);color:var(--bronze)}

/* card illustration */
.cIll{width:100%;height:126px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cStaffs{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:8px 22px}
.cSL{height:1px;background:currentColor;opacity:.28}
.r5 .cStaffs{color:var(--gold)}.r4 .cStaffs{color:var(--silver)}.r3 .cStaffs{color:var(--bronze)}
.cClef{position:absolute;left:22px;font-size:66px;line-height:1;top:50%;transform:translateY(-50%);opacity:.5}
.r5 .cClef{color:var(--gold)}.r4 .cClef{color:var(--silver)}.r3 .cClef{color:var(--bronze)}
.cNoteD{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.45;animation:bnF 2.4s ease-in-out infinite}
.cIllBg{position:absolute;inset:0;opacity:.06}
.r5 .cIllBg{background:radial-gradient(circle at center,var(--gold),transparent 70%)}
.r4 .cIllBg{background:radial-gradient(circle at center,var(--silver),transparent 70%)}
.r3 .cIllBg{background:radial-gradient(circle at center,var(--bronze),transparent 70%)}

/* card body */
.cBody{padding:11px 14px;position:relative;z-index:2}
.cDiv{height:1px;margin:8px 0;opacity:.3}
.r5 .cDiv{background:var(--gold)}.r4 .cDiv{background:var(--silver)}.r3 .cDiv{background:var(--bronze)}
.cName{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.45;margin-bottom:3px}
.cComp{font-size:12px;color:var(--text-d);margin-bottom:7px}
.cRec{font-size:11px;color:var(--text-d);line-height:1.65;
  padding:8px 10px;background:rgba(0,0,0,.22);border-radius:6px;
  border-left:2px solid;margin-bottom:8px;font-style:italic}
.r5 .cRec{border-color:var(--gold)}.r4 .cRec{border-color:var(--silver)}.r3 .cRec{border-color:var(--bronze)}
.cIntro{font-size:10px;color:var(--text-m);text-align:right}
.cIntro span{color:var(--text-d)}

/* ── action buttons ── */
.actBtns{display:flex;flex-direction:column;gap:10px;width:284px}
.aBtn{width:100%;padding:14px;border:none;border-radius:11px;cursor:pointer;
  font-family:'Noto Serif JP',serif;font-size:16px;font-weight:700;
  transition:transform .14s,opacity .14s}
.aBtn:active{transform:scale(.963);opacity:.8}
.aYt{background:linear-gradient(135deg,#c60000,#900);color:#fff;
  box-shadow:0 4px 18px rgba(200,0,0,.4);display:flex;align-items:center;justify-content:center;gap:8px}
.aAgain{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.13);color:var(--text-d)}

/* ── 10-pull grid ── */
.multiScroll{width:100%;overflow-x:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.multiCards{display:flex;gap:11px;padding-bottom:10px;width:max-content}
.mCard{width:144px;min-height:204px;border-radius:11px;padding:10px;
  cursor:pointer;position:relative;overflow:hidden;
  opacity:0;transform:rotateY(-90deg);
  animation:cardIn .45s cubic-bezier(.175,.885,.32,1.275) forwards}
.mCard.r5{background:linear-gradient(155deg,var(--ssr1),var(--ssr2));border:1.5px solid var(--ssrb);box-shadow:0 0 16px rgba(240,192,64,.42)}
.mCard.r4{background:linear-gradient(155deg,var(--sr1),var(--sr2));border:1.5px solid var(--srb);box-shadow:0 0 16px rgba(128,174,221,.32)}
.mCard.r3{background:linear-gradient(155deg,var(--r1),var(--r2));border:1.5px solid var(--rb)}
.mCard::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 50%);pointer-events:none}
.mStar{font-size:10px;margin-bottom:6px}
.r5 .mStar{color:var(--gold)}.r4 .mStar{color:var(--silver)}.r3 .mStar{color:var(--bronze)}
.mClef{font-size:38px;opacity:.45;text-align:center;margin:6px 0}
.r5 .mClef{color:var(--gold)}.r4 .mClef{color:var(--silver)}.r3 .mClef{color:var(--bronze)}
.mName{font-family:'Playfair Display',serif;font-size:11px;font-weight:700;color:var(--text);
  line-height:1.4;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mComp{font-size:9px;color:var(--text-d)}
.multiHint{font-size:11px;color:var(--text-m);text-align:center;padding:2px}

/* ── DETAIL OVERLAY ── */
#overlay{position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.on{opacity:1;pointer-events:all}
.oBg{position:absolute;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}
.oDet{position:relative;z-index:1}
.oClose{position:fixed;top:18px;right:18px;width:38px;height:38px;border:none;border-radius:50%;
  background:rgba(255,255,255,.09);color:#fff;font-size:17px;cursor:pointer;z-index:310;
  display:flex;align-items:center;justify-content:center}
.oYt{position:relative;z-index:1;width:284px}

/* ── HISTORY BADGE ── */
.histBadge{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,20px));right:16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:6px 11px;font-size:11px;color:var(--text-d);
  z-index:20;cursor:pointer;display:none}
.histBadge.on{display:block}

/* ── NEW BADGE ── */
.newBadge{position:absolute;top:-4px;right:-6px;background:var(--gold);color:#1a0c00;
  font-family:'Cinzel',serif;font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px}
</style>
</head>
<body>

<!-- Canvases -->
<canvas id="bgC"></canvas>
<canvas id="ptC"></canvas>

<!-- flash overlay -->
<div class="flash" id="flash"></div>

<!-- ═══════════════════════════════
     SCREEN 1: MAIN
═══════════════════════════════ -->
<div id="sMain" class="scr on">
  <header class="mHdr">
    <div class="mDeco">♩ ─────────────── ♩</div>
    <div class="mTitle">
      <span class="mT1">Classical Music</span>
      <span class="mT2">音楽ガチャ</span>
    </div>
    <div class="mDeco">♩ ─────────────── ♩</div>
  </header>

  <div class="banner">
    <div class="bArt">
      <div class="bCurtL"></div><div class="bCurtR"></div>
      <div class="bSpot"></div>
      <div class="bArch"></div>
      <div class="bFloor"></div>
      <div class="bStage"></div>
      <div class="bPodium"></div>
      <div class="bNotes">

<script>
/* ════════════════════════════════════════════════
   SAMPLE DATA — data.jsonに置き換え可能
   フィールド: introducer, title, composer, youtube, recommend
   任意フィールド: rarity(3/4/5), era
════════════════════════════════════════════════ */
const FALLBACK = [
  {introducer:"山田 花子",title:"交響曲第9番 ニ短調 Op.125「合唱」",composer:"L.V. ベートーヴェン",youtube:"https://www.youtube.com/watch?v=rOjHhS5MtvA",recommend:"聴覚を完全に失った状態で作曲された奇跡の大作。第4楽章の「歓喜の歌」は全人類への讃歌として今も世界中で演奏されています。",rarity:5,era:"古典派"},
  {introducer:"鈴木 一郎",title:"ピアノ協奏曲第21番 ハ長調 K.467",composer:"W.A. モーツァルト",youtube:"https://www.youtube.com/watch?v=Gc-kzmCUoJA",recommend:"映画で一躍有名になった第2楽章アンダンテは夢のように美しい。天才モーツァルトの輝きが最も純粋に結晶化された傑作。",rarity:5,era:"古典派"},
  {introducer:"田中 美咲",title:"ゴルトベルク変奏曲 BWV 988",composer:"J.S. バッハ",youtube:"https://www.youtube.com/watch?v=Gnyh20TRSsQ",recommend:"グールドの伝説的録音で世界的に知られるバッハの頂点。アリアから30の変奏を経て再びアリアへ戻る完璧な構造美。",rarity:5,era:"バロック"},
  {introducer:"木村 彩夏",title:"ラプソディ・イン・ブルー",composer:"G. ガーシュウィン",youtube:"https://www.youtube.com/watch?v=rnAWBtWagaQ",recommend:"ジャズとクラシックを融合した20世紀最大の革命。冒頭クラリネットのグリッサンドは音楽史上最も衝撃的な瞬間のひとつ。",rarity:5,era:"近代"},
  {introducer:"佐藤 健太",title:"四季 Op.8 第1番「春」",composer:"A. ヴィヴァルディ",youtube:"https://www.youtube.com/watch?v=e3nSvIiBNFo",recommend:"バロック音楽の代名詞。弾むような第1楽章は春の到来を鮮やかに描写し、聴く者の心に自然と笑顔をもたらします。",rarity:4,era:"バロック"},
  {introducer:"伊藤 さくら",title:"月の光（ベルガマスク組曲より）",composer:"C. ドビュッシー",youtube:"https://www.youtube.com/watch?v=CvFH_6DNRCY",recommend:"印象派音楽の真髄。月明かりに照らされた水面のような幻想的な音色は聴く者を別世界へと誘い込みます。",rarity:4,era:"印象派"},
  {introducer:"渡辺 剛",title:"夜想曲第2番 変ホ長調 Op.9-2",composer:"F. ショパン",youtube:"https://www.youtube.com/watch?v=YGRO05WcNDk",recommend:"ショパンが夜の静寂に綴った魂の詩。深夜に一人で聴けば心の奥底から感情が溢れてくる、永遠の名曲。",rarity:4,era:"ロマン派"},
  {introducer:"小林 莉子",title:"アヴェ・マリア D.839",composer:"F. シューベルト",youtube:"https://www.youtube.com/watch?v=JlpOfKQSf6M",recommend:"祈りの歌として世界中で愛される不朽の名作。透き通るような旋律は聴く者の心に深い安らぎと感動をもたらします。",rarity:4,era:"ロマン派"},
  {introducer:"松本 遥",title:"白鳥の湖より「情景」",composer:"P.I. チャイコフスキー",youtube:"https://www.youtube.com/watch?v=9cKDTNMFkXk",recommend:"バレエ音楽の最高峰。哀愁漂うオーボエの旋律は白鳥の優雅な姿を完璧に描写し、聴くたびに胸を打つ。",rarity:4,era:"ロマン派"},
  {introducer:"林 慎一",title:"組曲「惑星」より「木星」",composer:"G. ホルスト",youtube:"https://www.youtube.com/watch?v=Jk4o1WNRFME",recommend:"「ジュピター」の名で親しまれる壮大な名作。中間部の宏大な旋律は宇宙の広がりを感じさせる感動的なアンセム。",rarity:4,era:"近代"},
  {introducer:"森 悠子",title:"チェロ協奏曲 ロ短調 Op.104",composer:"A. ドヴォルザーク",youtube:"https://www.youtube.com/watch?v=RxN4KNbznf0",recommend:"チェロ協奏曲の王者。ロストロポーヴィチの演奏で聴けば魂が揺さぶられる。故郷への郷愁と人生の深みを感じる大傑作。",rarity:4,era:"ロマン派"},
  {introducer:"中村 義人",title:"ハンガリー舞曲第5番",composer:"J. ブラームス",youtube:"https://www.youtube.com/watch?v=7DGBhCCMNRg",recommend:"情熱的なリズムと豊かなメロディが一体となった傑作。最初のフレーズから体が動き出す躍動感あふれる名曲です。",rarity:3,era:"ロマン派"},
  {introducer:"加藤 誠",title:"交響曲第9番「新世界より」第4楽章",composer:"A. ドヴォルザーク",youtube:"https://www.youtube.com/watch?v=jOofzffyDSA",recommend:"チェコの作曲家がアメリカで故郷への思いを込めた大作。壮大な金管の咆哮は聴く者の魂に火をつける。",rarity:3,era:"ロマン派"},
  {introducer:"吉田 真由",title:"トッカータとフーガ ニ短調 BWV 565",composer:"J.S. バッハ",youtube:"https://www.youtube.com/watch?v=Nnuq9PXbywA",recommend:"「ダダダダーン」の出だしで誰もが知るオルガンの王道。バッハの対位法の天才性が最もわかりやすく凝縮された壮大な作品。",rarity:3,era:"バロック"},
  {introducer:"山本 拓海",title:"アイネ・クライネ・ナハトムジーク K.525",composer:"W.A. モーツァルト",youtube:"https://www.youtube.com/watch?v=o1FSdFLHM9E",recommend:"モーツァルトが生み出した最もポピュラーな弦楽曲。軽やかで華やかなこの曲はクラシック入門の最高の一曲です。",rarity:3,era:"古典派"}
];

/* ════ STATE ════ */
let DATA = [];
let pullResults = [];
let pullCount = 1;
let totalPulls = 0;
let history = [];

/* ════ LOAD DATA ════ */
async function loadData() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error();
    const raw = await res.json();
    DATA = raw.map(normalizeEntry);
  } catch {
    DATA = FALLBACK.map(normalizeEntry);
  }
  init();
}

function normalizeEntry(d, i) {
  const rarity = d.rarity || d.レアリティ || assignRarity();
  return {
    id: d.id || i,
    introducer: d.introducer || d['曲の紹介者'] || d['紹介者'] || '匿名',
    title: d.title || d['曲名'] || '無題',
    composer: d.composer || d['作曲者'] || '不明',
    youtube: d.youtube || d['youtube_link'] || d['YouTube'] || '',
    recommend: d.recommend || d['おすすめポイント'] || '',
    rarity: Number(rarity),
    era: d.era || d['時代'] || '不明'
  };
}

function assignRarity() {
  const r = Math.random() * 100;
  return r < 3 ? 5 : r < 18 ? 4 : 3;
}

/* ════ INIT ════ */
function init() {
  document.getElementById('featCount').textContent = `全 ${DATA.length} 曲収録`;
  buildMarquee();
  initBgCanvas();
}

function buildMarquee() {
  const el = document.getElementById('featMarquee');
  const items = DATA.map(d => `<span>♪ ${d.title} ／ ${d.composer}</span>`).join('');
  el.innerHTML = items + items; // duplicate for seamless loop
}

/* ════ BG CANVAS ════ */
function initBgCanvas() {
  const cv = document.getElementById('bgC');
  const ctx = cv.getContext('2d');
  let stars = [];
  function resize() {
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    stars = Array.from({length:90},()=>({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:Math.random()*1.4+.3, a:Math.random(),
      sp:.002+Math.random()*.006, ph:Math.random()*Math.PI*2
    }));
  }
  function draw(t) {
    ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      const a = s.a * (.45+.55*Math.sin(t*.001*s.sp*1000+s.ph));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,242,196,${a})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(draw);
}

/* ════ GACHA LOGIC ════ */
function pickRarity(forceSR=false) {
  if (forceSR) return Math.random()<.17 ? 5 : 4;
  const r = Math.random()*100;
  return r<3 ? 5 : r<18 ? 4 : 3;
}

function pickByRarity(rar) {
  const pool = DATA.filter(d=>d.rarity===rar);
  if (!pool.length) return DATA[Math.floor(Math.random()*DATA.length)];
  return pool[Math.floor(Math.random()*pool.length)];
}

function doPull(count) {
  const results=[];
  for(let i=0;i<count;i++){
    const isLast = i===count-1;
    const hasSR = results.some(r=>r.rarity>=4);
    const rar = pickRarity(isLast && !hasSR && count>1);
    results.push(pickByRarity(rar));
  }
  return results;
}

/* ════ PULL FLOW ════ */
function startPull(count) {
  pullCount = count;
  pullResults = doPull(count);
  totalPulls += count;
  showScreen('sPull');
  runPullAnimation();
}

function runPullAnimation() {
  // Animate floating notes
  const nc = document.getElementById('pullNotes');
  nc.innerHTML='';
  const notes=['♩','♪','♫','♬','𝄞'];
  for(let i=0;i<8;i++){
    const n=document.createElement('div');
    n.className='pn';
    n.style.cssText=`left:${10+Math.random()*80}%;top:${10+Math.random()*80}%;animation-delay:${Math.random()*2}s`;
    n.textContent=notes[Math.floor(Math.random()*notes.length)];
    nc.appendChild(n);
  }

  // Flash → result after delay
  setTimeout(()=>{
    const fl=document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(()=>{ fl.classList.remove('on'); showResult(); },180);
  }, 2400);
}

/* ════ RESULT ════ */
function showResult() {
  showScreen('sRes');
  history = [...pullResults, ...history].slice(0,50);

  const maxR = Math.max(...pullResults.map(d=>d.rarity));

  if(pullCount===1){
    document.getElementById('rSingle').classList.add('on');
    document.getElementById('rMulti').classList.remove('on');
    const card = pullResults[0];
    const el = document.getElementById('singleCard');
    el.className=`gCard r${card.rarity}`;
    el.innerHTML=renderCard(card);
    el.style.animationDelay='0s';
    document.getElementById('ytBtn').onclick=()=>goYt(card.youtube);
    document.getElementById('resSubtitle').textContent=rarLabel(card.rarity)+' を引きました！';
  } else {
    document.getElementById('rSingle').classList.remove('on');
    document.getElementById('rMulti').classList.add('on');
    const mc=document.getElementById('multiCards');
    mc.innerHTML='';
    pullResults.forEach((card,i)=>{
      const d=document.createElement('div');
      d.className=`mCard r${card.rarity}`;
      d.style.animationDelay=`${i*.09}s`;
      d.innerHTML=`<div class="mStar">${'★'.repeat(card.rarity)}</div>
        <div class="mClef">𝄞</div>
        <div class="mName">${card.title}</div>
        <div class="mComp">${card.composer}</div>`;
      d.onclick=()=>openDetail(card);
      mc.appendChild(d);
    });
    document.getElementById('resSubtitle').textContent=`${rarLabel(maxR)} 含む10曲！`;
  }

  // Particles
  startParticles(maxR);
}

function rarLabel(r){ return r===5?'★★★★★ SSR':r===4?'★★★★ SR':'★★★ R'; }

/* ════ CARD HTML ════ */
function renderCard(card){
  const stars='★'.repeat(card.rarity)+'☆'.repeat(5-card.rarity);
  return `
    <div class="cTop">
      <div class="cStars">${stars}</div>
      <div class="cBadge">${card.era}</div>
    </div>
    <div class="cIll">
      <div class="cIllBg"></div>
      <div class="cStaffs">${'<div class="cSL"></div>'.repeat(5)}</div>
      <div class="cClef">𝄞</div>
      <div class="cNoteD">♪</div>
    </div>
    <div class="cBody">
      <div class="cName">${card.title}</div>
      <div class="cComp">${card.composer}</div>
      <div class="cDiv"></div>
      <div class="cRec">「${card.recommend}」</div>
      <div class="cDiv"></div>
      <div class="cIntro">紹介者：<span>${card.introducer}</span></div>
    </div>`;
}

/* ════ DETAIL OVERLAY ════ */
function openDetail(card) {
  const el=document.getElementById('detCard');
  el.className=`gCard r${card.rarity}`;
  el.innerHTML=renderCard(card);
  el.style.animationDelay='0s';
  document.getElementById('ovYtBtn').onclick=()=>goYt(card.youtube);
  document.getElementById('overlay').classList.add('on');
}
function closeDetail(){ document.getElementById('overlay').classList.remove('on'); }

/* ════ YOUTUBE ════ */
function goYt(url){
  if(!url){ alert('YouTube リンクが設定されていません'); return; }
  window.open(url,'_blank');
}

/* ════ SCREEN ════ */
function showScreen(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function goMain(){
  stopParticles();
  document.getElementById('rSingle').classList.remove('on');
  document.getElementById('rMulti').classList.remove('on');
  showScreen('sMain');
}

/* ════ PARTICLES ════ */
let ptAnim=null;
const PT_COLORS={
  5:['#f0c040','#fff4a0','#ffd700','#ffe880','#ffffff'],
  4:['#b8cce0','#e0f0ff','#90b8e0','#ffffff','#c0d8f0'],
  3:['#c88450','#e0a870','#a06030','#d0b080','#e8c090']
};

function startParticles(rarity){
  const cv=document.getElementById('ptC');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  cv.classList.add('on');
  const ctx=cv.getContext('2d');
  const cols=PT_COLORS[rarity]||PT_COLORS[3];
  const count={5:70,4:45,3:24}[rarity]||24;
  const pts=[];
  const shapes=['star','note','diamond'];

  for(let i=0;i<count;i++){
    pts.push({
      x:Math.random()*cv.width, y:-20-Math.random()*140,
      vx:(Math.random()-.5)*2.5, vy:1.5+Math.random()*3.5,
      r:3+Math.random()*5, col:cols[Math.floor(Math.random()*cols.length)],
      a:1, rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.18,
      shape:shapes[Math.floor(Math.random()*shapes.length)]
    });
  }

  const startT=Date.now();
  function step(){
    const elapsed=Date.now()-startT;
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.rot+=p.vr;
      if(elapsed>2200) p.a-=.018;
      if(p.a>0 && p.y<cv.height+60){ alive=true; drawPt(ctx,p); }
    });
    if(alive && elapsed<5000) ptAnim=requestAnimationFrame(step);
    else { cv.classList.remove('on'); ctx.clearRect(0,0,cv.width,cv.height); }
  }

  function drawPt(ctx,p){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha=Math.max(0,p.a); ctx.fillStyle=p.col;
    if(p.shape==='star'){
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i*Math.PI*.4-Math.PI/2;
        const ia=a+Math.PI*.2;
        i===0?ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r):ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
        ctx.lineTo(Math.cos(ia)*p.r*.4,Math.sin(ia)*p.r*.4);
      }
      ctx.closePath(); ctx.fill();
    } else if(p.shape==='diamond'){
      ctx.beginPath();
      ctx.moveTo(0,-p.r); ctx.lineTo(p.r*.6,0); ctx.lineTo(0,p.r); ctx.lineTo(-p.r*.6,0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.font=`${p.r*3}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('♪',0,0);
    }
    ctx.restore();
  }
  ptAnim=requestAnimationFrame(step);
}

function stopParticles(){
  if(ptAnim){cancelAnimationFrame(ptAnim);ptAnim=null;}
  const cv=document.getElementById('ptC');
  cv.classList.remove('on');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

/* ════ BOOT ════ */
loadData();
</script>
