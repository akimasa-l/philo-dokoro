<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古典楽曲ガチャ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold-light:#e8cf88;--gold-pale:#f5e8c0;
  --cream:#f5efe0;--deep:#080604;--muted:#7a6840;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;}
body{background:var(--deep);min-height:100vh;font-family:'Noto Serif JP',serif;color:var(--cream);position:relative;}

/* ===== 背景 ===== */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 65%,rgba(100,65,15,0.2) 0%,transparent 65%),#080604;}
.star{position:fixed;border-radius:50%;background:#e8cf88;
  animation:twinkle var(--d) ease-in-out var(--dl) infinite;opacity:0;}
@keyframes twinkle{0%,100%{opacity:0;}50%{opacity:var(--op);}}

/* もわもわ常時背景 */
.bg-mist{position:fixed;border-radius:50%;pointer-events:none;z-index:1;
  animation:bgMist var(--bd) ease-in-out var(--bdl) infinite;opacity:0;}
@keyframes bgMist{
  0%{opacity:0;transform:scale(0.85) translateY(10px);}
  40%{opacity:var(--bop);}70%{opacity:var(--bop);}
  100%{opacity:0;transform:scale(1.2) translateY(-50px);}
}

/* ===== ろうそく ===== */
.candles-row{display:flex;justify-content:center;gap:28px;margin-bottom:24px;position:relative;z-index:2;}
.candle-wrap{position:relative;display:flex;flex-direction:column;align-items:center;}
.candle-glow{position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  width:70px;height:70px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,190,60,0.28) 0%,transparent 70%);
  animation:cglow 1.3s ease-in-out infinite alternate;}
@keyframes cglow{0%{opacity:0.55;transform:translateX(-50%) scale(1);}100%{opacity:1;transform:translateX(-50%) scale(1.3);}}
.flame-wrap{position:relative;width:20px;height:34px;margin-bottom:-1px;}
.flame{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:13px;height:26px;
  background:radial-gradient(ellipse at 50% 80%,#fff3a0 0%,#ffcc44 30%,#ff8800 65%,transparent 100%);
  border-radius:50% 50% 30% 30%;transform-origin:bottom center;
  animation:flicker 0.11s ease-in-out infinite alternate;}
.flame-inner{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:6px;height:15px;
  background:radial-gradient(ellipse at 50% 70%,#ffffff 0%,#fff8d0 60%,transparent 100%);
  border-radius:50% 50% 30% 30%;transform-origin:bottom center;
  animation:flickerI 0.08s ease-in-out infinite alternate;}
@keyframes flicker{0%{transform:translateX(-50%) scaleX(1) scaleY(1) rotate(-1.5deg);}100%{transform:translateX(-50%) scaleX(0.83) scaleY(1.1) rotate(2deg);}}
@keyframes flickerI{0%{transform:translateX(-50%) scaleX(1) scaleY(1);}100%{transform:translateX(-50%) scaleX(0.75) scaleY(1.12);}}
.candle-wick{width:2px;height:7px;background:#3a2a10;border-radius:1px;}
.candle-body{width:13px;height:48px;
  background:linear-gradient(to right,#cfc0a0 0%,#ede0c0 40%,#c0b080 100%);
  border-radius:2px;position:relative;}
.candle-body::after{content:'';position:absolute;top:0;left:2px;right:2px;height:5px;background:rgba(160,120,40,0.4);border-radius:1px;}
.drip{position:absolute;width:4px;border-radius:0 0 3px 3px;
  background:linear-gradient(to bottom,#e0d090,#c8b878);
  animation:drip var(--dd) ease-in var(--ddl) infinite;opacity:0;}
@keyframes drip{0%{height:0;opacity:1;top:0;}60%{height:16px;opacity:1;}100%{height:20px;opacity:0;}}

/* ===== コンテナ ===== */
.container{position:relative;z-index:2;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px;}
.title-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;
  letter-spacing:0.45em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;text-align:center;}
.title-main{font-size:26px;font-weight:600;letter-spacing:0.2em;color:var(--cream);
  line-height:1.4;text-align:center;margin-bottom:6px;}
.deco-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;}
.deco-line{height:1px;width:50px;background:linear-gradient(to right,transparent,var(--gold));}
.deco-line.r{background:linear-gradient(to left,transparent,var(--gold));}
.deco-dia{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);}
.counter{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.2em;
  color:var(--muted);margin-bottom:20px;}
.counter em{color:var(--gold-light);font-style:normal;font-size:16px;}

/* ===== 球体 ===== */
.orb-wrap{position:relative;width:200px;height:200px;margin-bottom:4px;}
.orb-ring-a{position:absolute;inset:-14px;border-radius:50%;
  border:1px solid rgba(201,168,76,0.18);
  animation:rot 14s linear infinite;}
.orb-ring-a::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 10px 4px rgba(201,168,76,0.7);}
.orb-ring-b{position:absolute;inset:-7px;border-radius:50%;
  border:1px solid rgba(201,168,76,0.22);
  animation:rot 9s linear infinite reverse;}
.orb-ring-b::after{content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--gold-light);
  box-shadow:0 0 6px 3px rgba(232,207,136,0.6);}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orb{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 35% 28%,rgba(255,240,180,0.22) 0%,transparent 45%),
    radial-gradient(circle,#2e2008 0%,#140e03 55%,#080604 100%);
  border:1.5px solid rgba(201,168,76,0.32);
  box-shadow:0 0 28px rgba(201,168,76,0.06),inset 0 0 50px rgba(0,0,0,0.9),inset 0 2px 6px rgba(255,240,180,0.1);}
.orb-ambient{position:absolute;inset:-28px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0) 40%,transparent 70%);
  pointer-events:none;transition:all 0.4s ease;}
.orb-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.orb-note{font-family:'Cormorant Garamond',serif;font-size:54px;color:rgba(201,168,76,0.48);line-height:1;
  animation:noteFloat 3.2s ease-in-out infinite;}
@keyframes noteFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.orb-label{font-size:10px;letter-spacing:0.42em;color:rgba(201,168,76,0.3);text-transform:uppercase;}

/* ===== ボタンエリア ===== */
.btn-area{position:relative;margin-top:28px;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;}

/* 音符フィールド */
.note-field{position:absolute;inset:-50px;pointer-events:none;overflow:visible;z-index:0;}
.fn{position:absolute;font-family:'Cormorant Garamond',serif;font-size:var(--fs);
  color:var(--gold);opacity:0;pointer-events:none;
  text-shadow:0 0 10px rgba(201,168,76,0.9);
  animation:fnRise var(--nd) ease-out var(--ndl) infinite;}
@keyframes fnRise{
  0%{opacity:0;transform:translateY(0) rotate(var(--nr)) scale(0.4);}
  15%{opacity:1;}
  75%{opacity:0.5;}
  100%{opacity:0;transform:translateY(-80px) rotate(calc(var(--nr)+40deg)) scale(1.2);}
}

/* ガチャボタン本体 */
.gacha-btn{
  position:relative;width:200px;padding:17px 0;
  background:transparent;border:none;outline:none;cursor:pointer;
  font-family:'Noto Serif JP',serif;font-size:15px;letter-spacing:0.35em;
  color:var(--gold-light);overflow:visible;z-index:1;
}
.gacha-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* SVGボーダー（破線アニメ） */
.btn-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.btn-svg rect{fill:rgba(201,168,76,0.04);stroke:var(--gold);stroke-width:0.8;
  stroke-dasharray:6 5;animation:dashRun 2.8s linear infinite;}
@keyframes dashRun{to{stroke-dashoffset:-120;}}

/* ボタンのキラキラ粒 */
.bsp{position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--gold-light);pointer-events:none;
  box-shadow:0 0 6px 3px rgba(232,207,136,0.75);
  animation:bspAnim var(--bs) ease-in-out var(--bsl) infinite;opacity:0;}
@keyframes bspAnim{0%,100%{opacity:0;transform:scale(0.2);}50%{opacity:1;transform:scale(1);}}

/* 光沢スライド */
.btn-shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.btn-shine::after{content:'';position:absolute;top:0;left:0;width:40%;height:100%;
  background:linear-gradient(to right,transparent,rgba(255,240,180,0.15),transparent);
  animation:shineSlide 2.4s ease-in-out infinite;}
@keyframes shineSlide{0%{transform:translateX(-200%);}50%,100%{transform:translateX(400%);}}

.btn-text-inner{position:relative;z-index:1;}

/* ガチャボタン下の小ボタン */
.history-btn{background:transparent;border:1px solid rgba(201,168,76,0.2);color:var(--muted);
  font-family:'Noto Serif JP',serif;font-size:12px;letter-spacing:0.25em;
  padding:9px 24px;cursor:pointer;transition:all 0.2s;margin-top:2px;}
.history-btn:hover{border-color:rgba(201,168,76,0.4);color:var(--gold);}

/* ===== Canvasレイヤー ===== */
#fxCanvas{position:fixed;inset:0;z-index:50;pointer-events:none;}

/* ===== ぴかーん1（ガチャ時） ===== */
.pikan-a{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,250,200,0.95) 0%,rgba(255,210,80,0.7) 20%,rgba(201,168,76,0.35) 50%,transparent 75%);}

/* ===== 封印画面 ===== */
.seal-screen{position:fixed;inset:0;z-index:100;display:none;
  background:#080604;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.seal-screen.active{display:flex;}
.rays{position:absolute;inset:0;pointer-events:none;}
.ray{position:absolute;top:50%;left:50%;width:200%;height:1.5px;
  transform-origin:0 50%;
  background:linear-gradient(to right,transparent,rgba(201,168,76,0.18),transparent);
  animation:rayP 2.2s ease-in-out infinite;}
@keyframes rayP{0%,100%{opacity:0.25;}50%{opacity:0.9;}}
.seal-circle{width:150px;height:150px;border-radius:50%;
  border:1px solid rgba(201,168,76,0.55);
  display:flex;align-items:center;justify-content:center;position:relative;
  margin-bottom:32px;animation:rot 22s linear infinite;}
.seal-circle::before{content:'';position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(201,168,76,0.28);}
.seal-circle::after{content:'';position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(201,168,76,0.14);}
.seal-inner{animation:rot 22s linear infinite reverse;font-family:'Cormorant Garamond',serif;font-size:56px;color:rgba(201,168,76,0.55);}
.seal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;
  color:rgba(201,168,76,0.85);letter-spacing:0.15em;margin-bottom:8px;text-align:center;}
.seal-sub{font-size:11px;letter-spacing:0.4em;color:rgba(201,168,76,0.35);margin-bottom:48px;text-align:center;}
.tap-btn{position:relative;width:220px;padding:18px 0;
  border:1px solid rgba(201,168,76,0.55);background:transparent;
  color:var(--gold-light);font-family:'Noto Serif JP',serif;font-size:14px;letter-spacing:0.35em;
  cursor:pointer;outline:none;
  animation:tapPulse 1.8s ease-in-out infinite;}
@keyframes tapPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}50%{box-shadow:0 0 0 14px rgba(201,168,76,0.13);}}
.tap-btn::before,.tap-btn::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--gold);border-style:solid;opacity:0.65;}
.tap-btn::before{top:5px;left:5px;border-width:1px 0 0 1px;}
.tap-btn::after{bottom:5px;right:5px;border-width:0 1px 1px 0;}
.tap-hint{margin-top:18px;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:13px;letter-spacing:0.3em;color:rgba(201,168,76,0.4);
  animation:hintFloat 2s ease-in-out infinite;}
@keyframes hintFloat{0%,100%{opacity:0.4;transform:translateY(0);}50%{opacity:0.8;transform:translateY(-5px);}}

/* ===== ぴかーん2（タップ時） ===== */
.pikan-b{position:fixed;inset:0;z-index:110;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#ffffff 0%,#fffce0 15%,rgba(255,215,80,0.65) 40%,transparent 70%);}

/* ===== 結果画面 ===== */
.result-screen{position:fixed;inset:0;z-index:120;display:none;
  flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;
  background:radial-gradient(ellipse at 50% 20%,rgba(110,70,15,0.22) 0%,transparent 65%),#080604;
  padding:46px 24px 60px;}
.result-screen.active{display:flex;}
.r-hd{display:flex;align-items:center;gap:14px;margin-bottom:26px;width:100%;max-width:340px;}
.r-line{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(201,168,76,0.5));}
.r-line.rev{background:linear-gradient(to left,transparent,rgba(201,168,76,0.5));}
.r-gem{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);}
.result-card{width:100%;max-width:340px;border:1px solid rgba(201,168,76,0.3);
  padding:28px 22px;background:rgba(18,12,3,0.88);position:relative;
  animation:cardIn 0.65s cubic-bezier(0.23,1,0.32,1) both;}
@keyframes cardIn{from{opacity:0;transform:scale(0.88) translateY(28px);}to{opacity:1;transform:scale(1) translateY(0);}}
.result-card::before,.result-card::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--gold);border-style:solid;opacity:0.5;}
.result-card::before{top:7px;left:7px;border-width:1px 0 0 1px;}
.result-card::after{bottom:7px;right:7px;border-width:0 1px 1px 0;}
.rc-intro{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:0.3em;color:var(--muted);margin-bottom:16px;}
.rc-title{font-size:17px;font-weight:600;line-height:1.7;color:var(--cream);margin-bottom:6px;letter-spacing:0.04em;}
.rc-composer{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);letter-spacing:0.15em;margin-bottom:20px;}
.rc-div{height:1px;background:linear-gradient(to right,transparent,rgba(201,168,76,0.35),transparent);margin:16px 0;}
.rc-hl-label{font-size:10px;letter-spacing:0.4em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.rc-hl{font-size:14px;line-height:1.9;color:rgba(245,239,224,0.82);}
.rc-yt{display:block;margin-top:22px;padding:14px;border:1px solid rgba(201,168,76,0.4);
  text-align:center;text-decoration:none;color:var(--gold-light);font-size:12px;letter-spacing:0.3em;
  background:rgba(201,168,76,0.04);transition:background 0.2s;}
.rc-yt:hover{background:rgba(201,168,76,0.1);}
.back-btn{margin-top:26px;background:transparent;border:none;color:var(--muted);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;
  letter-spacing:0.25em;cursor:pointer;padding:8px 32px;}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<canvas id="fxCanvas"></canvas>
<div class="pikan-a" id="pikanA"></div>
<div class="pikan-b" id="pikanB"></div>

<!-- ===== メイン画面 ===== -->
<div class="container" id="mainScreen">
  <div class="title-sub">Classical Music</div>
  <div class="title-main">古典楽曲<br>ガチャ</div>
  <div class="deco-row">
    <div class="deco-line"></div><div class="deco-dia"></div><div class="deco-line r"></div>
  </div>
  <div class="candles-row" id="candlesRow"></div>
  <div class="counter">抽選回数：<em id="pullCount">0</em>回</div>
  <div class="orb-wrap" id="orbWrap">
    <div class="orb-ambient" id="orbAmbient"></div>
    <div class="orb-ring-a"></div>
    <div class="orb-ring-b"></div>
    <div class="orb" id="orb">
      <div class="orb-inner">
        <div class="orb-note">♩</div>
        <div class="orb-label">Musica</div>
      </div>
    </div>
  </div>
  <div class="btn-area" id="btnArea">
    <div class="note-field" id="noteField"></div>
    <button class="gacha-btn" id="gachaBtn" onclick="startGacha()">
      <svg class="btn-svg"><rect x="1" y="1" width="198" height="52" rx="0"/></svg>
      <div class="btn-shine"></div>
      <span class="btn-text-inner">抽　　選</span>
    </button>
    <button class="history-btn" onclick="showHistory()">過去の抽選</button>
  </div>
</div>

<!-- ===== 封印画面 ===== -->
<div class="seal-screen" id="sealScreen">
  <div class="rays" id="rays"></div>
  <div class="seal-circle"><div class="seal-inner">𝄞</div></div>
  <div class="seal-title">一曲が選ばれました</div>
  <div class="seal-sub">A piece has been chosen</div>
  <button class="tap-btn" onclick="doReveal()">タップして解禁</button>
  <div class="tap-hint">↑ tap to reveal ↑</div>
</div>

<!-- ===== 結果画面 ===== -->
<div class="result-screen" id="resultScreen">
  <div class="r-hd">
    <div class="r-line"></div><div class="r-gem"></div><div class="r-line rev"></div>
  </div>
  <div class="result-card" id="resultCard"></div>
  <button class="back-btn" onclick="closeResult()">← 戻る</button>
</div>

<script>
/* ===== データ ===== */
const musicData=[
  {id:1,introducer:"山田 太郎",title:"交響曲第5番 ハ短調 Op.67「運命」第1楽章",composer:"ルートヴィヒ・ヴァン・ベートーヴェン",youtube:"https://www.youtube.com/watch?v=_4IRMYuE1hI",highlight:"あの有名な「ダダダダーン」の動機が全曲を貫く圧倒的な構成力。運命と対峙する人間の意志を感じてほしい。"},
  {id:2,introducer:"佐藤 花子",title:"ピアノ協奏曲第2番 ハ短調 Op.18",composer:"セルゲイ・ラフマニノフ",youtube:"https://www.youtube.com/watch?v=rEGOihjqO9w",highlight:"冒頭のピアノ独奏から鳥肌が立つ。ロシアの広大な大地と憂愁が混然一体となった、至高のロマン派音楽。"},
  {id:3,introducer:"鈴木 一郎",title:"弦楽四重奏曲第14番 ニ短調 K.421",composer:"ヴォルフガング・アマデウス・モーツァルト",youtube:"https://www.youtube.com/watch?v=m4hVVMEbRNs",highlight:"モーツァルトが数少ない短調で書いた傑作。表面の美しさの裏に滲む深い哀愁と葛藤が癖になる。"},
  {id:4,introducer:"田中 美咲",title:"ゴルトベルク変奏曲 BWV 988",composer:"ヨハン・ゼバスティアン・バッハ",youtube:"https://www.youtube.com/watch?v=Ah392lnFHxM",highlight:"グールドの演奏で聴いてほしい。アリアから始まり30の変奏を経て再びアリアへ。宇宙が閉じるような感動。"},
  {id:5,introducer:"中村 勇気",title:"交響曲第9番 ニ短調 Op.125「合唱」第4楽章",composer:"ルートヴィヒ・ヴァン・ベートーヴェン",youtube:"https://www.youtube.com/watch?v=t3217H8JppI",highlight:"耳が聞こえない状態で書かれた人類の宝。歓喜の歌が始まる瞬間、毎回涙が出る。"},
  {id:6,introducer:"小林 奈々",title:"夜想曲（ノクターン）第20番 嬰ハ短調「遺作」",composer:"フレデリック・ショパン",youtube:"https://www.youtube.com/watch?v=YGRO05WcNDk",highlight:"映画『戦場のピアニスト』で使われた曲。儚くも美しいメロディが心に染みる。深夜に一人で聴いてほしい。"},
  {id:7,introducer:"伊藤 健太",title:"四季 ヴァイオリン協奏曲「春」Op.8 第1番",composer:"アントニオ・ヴィヴァルディ",youtube:"https://www.youtube.com/watch?v=6LAPWVS_OVM",highlight:"春の陽光と小鳥のさえずりが目に浮かぶ。バロック音楽の中でも特に絵画的で、聴き始めの入門にも最適。"},
  {id:8,introducer:"渡辺 さくら",title:"交響曲第6番 ロ短調 Op.74「悲愴」第4楽章",composer:"ピョートル・チャイコフスキー",youtube:"https://www.youtube.com/watch?v=7BNFKmCSqbQ",highlight:"チャイコフスキーが初演の9日後に謎の死を遂げた、まるで遺書のような作品。絶望と諦観の美しさ。"},
  {id:9,introducer:"松本 隆",title:"亡き王女のためのパヴァーヌ",composer:"モーリス・ラヴェル",youtube:"https://www.youtube.com/watch?v=0fxLEVHdAXs",highlight:"タイトルは「スペインの古い絵画に描かれた幼い王女が踊るパヴァーヌ」のイメージ。夢と現実の境を漂うような音楽。"},
  {id:10,introducer:"加藤 里奈",title:"ピアノソナタ第14番 嬰ハ短調 Op.27-2「月光」第1楽章",composer:"ルートヴィヒ・ヴァン・ベートーヴェン",youtube:"https://www.youtube.com/watch?v=4Tr0otuiQuU",highlight:"月夜の湖面に波紋が広がるような三連符の連続。暗闇の中に差し込む静謐な光を感じる永遠の名曲。"}
];

let pullCount=0, currentResult=null, isAnimating=false, history=[];

/* ===== Canvas ===== */
const canvas=document.getElementById('fxCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

/* ===== パーティクル ===== */
let particles=[];

function burst(cx,cy,count=70,spread=1){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=(2+Math.random()*7)*spread;
    const hue=30+Math.random()*30;
    const big=Math.random()<0.15;
    particles.push({
      x:cx+(Math.random()-0.5)*30, y:cy+(Math.random()-0.5)*30,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1.5,
      size: big ? 3+Math.random()*3 : 1+Math.random()*2.5,
      life:1, decay:0.016+Math.random()*0.01,
      hue, gravity:0.1, type:'spark', star:big
    });
  }
}

function mistBurst(cx,cy,count=14){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=0.5+Math.random()*1.5;
    particles.push({
      x:cx+(Math.random()-0.5)*40, y:cy+(Math.random()-0.5)*40,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-0.6,
      size:30+Math.random()*60,
      life:1, decay:0.007+Math.random()*0.005,
      hue:35+Math.random()*20, gravity:0, type:'mist'
    });
  }
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=p.gravity||0;
    p.vx*=0.97; p.vy*=0.97;
    p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.save();
    if(p.type==='mist'){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
      g.addColorStop(0,`hsla(${p.hue},75%,65%,${p.life*0.18})`);
      g.addColorStop(1,`hsla(${p.hue},60%,45%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else {
      ctx.globalAlpha=p.life;
      ctx.fillStyle=`hsl(${p.hue},92%,70%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
      if(p.star && p.life>0.3){
        ctx.strokeStyle=`hsla(${p.hue},100%,88%,${p.life*0.7})`;
        ctx.lineWidth=0.9;
        const s=p.size*2;
        ctx.beginPath();
        ctx.moveTo(p.x-s,p.y); ctx.lineTo(p.x+s,p.y);
        ctx.moveTo(p.x,p.y-s); ctx.lineTo(p.x,p.y+s);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

/* ===== 流れ星 ===== */
let meteors=[];
function addMeteor(){
  const a=Math.PI/5+Math.random()*Math.PI/5;
  meteors.push({x:Math.random()*W,y:-20,vx:Math.cos(a)*14,vy:Math.sin(a)*14,life:1,len:50+Math.random()*70});
}
function drawMeteors(){
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.x+=m.vx; m.y+=m.vy; m.life-=0.026;
    if(m.life<=0||m.y>H+30){meteors.splice(i,1);continue;}
    const g=ctx.createLinearGradient(m.x-m.vx*5,m.y-m.vy*5,m.x,m.y);
    g.addColorStop(0,'rgba(232,207,136,0)');
    g.addColorStop(1,`rgba(255,245,170,${m.life})`);
    ctx.save(); ctx.strokeStyle=g; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(m.x-m.vx*5,m.y-m.vy*5); ctx.lineTo(m.x,m.y); ctx.stroke();
    ctx.restore();
  }
}

/* メインループ */
function loop(){
  ctx.clearRect(0,0,W,H);
  drawMeteors();
  drawParticles();
  requestAnimationFrame(loop);
}
loop();
setInterval(()=>{if(Math.random()<0.3)addMeteor();},2500);

/* ===== 星生成 ===== */
(function(){
  const bg=document.getElementById('bgLayer');
  for(let i=0;i<100;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=1+Math.random()*1.8;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*6}s;--op:${0.15+Math.random()*0.7}`;
    bg.appendChild(s);
  }
})();

/* ===== 背景もわもわ ===== */
(function(){
  const bg=document.getElementById('bgLayer');
  for(let i=0;i<10;i++){
    const m=document.createElement('div');
    m.className='bg-mist';
    const sz=70+Math.random()*110;
    m.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${35+Math.random()*55}%;background:radial-gradient(circle,rgba(170,120,30,0.09) 0%,transparent 70%);--bd:${7+Math.random()*9}s;--bdl:${Math.random()*7}s;--bop:${0.4+Math.random()*0.5}`;
    bg.appendChild(m);
  }
})();

/* ===== ろうそく生成 ===== */
(function(){
  const row=document.getElementById('candlesRow');
  for(let i=0;i<5;i++){
    const w=document.createElement('div');
    w.className='candle-wrap';
    w.innerHTML=`
      <div class="candle-glow"></div>
      <div class="flame-wrap"><div class="flame"></div><div class="flame-inner"></div></div>
      <div class="candle-wick"></div>
      <div class="candle-body">
        <div class="drip" style="left:2px;--dd:${4+Math.random()*4}s;--ddl:${Math.random()*4}s"></div>
        <div class="drip" style="left:7px;--dd:${5+Math.random()*5}s;--ddl:${1+Math.random()*4}s"></div>
      </div>`;
    row.appendChild(w);
  }
})();

/* ===== ボタンのキラキラ＋音符生成 ===== */
(function(){
  const area=document.getElementById('btnArea');
  const nf=document.getElementById('noteField');
  const notes=['♩','♪','♫','♬','𝄞','𝄢'];
  /* キラキラ */
  for(let i=0;i<10;i++){
    const sp=document.createElement('div');
    sp.className='bsp';
    sp.style.cssText=`left:${-20+Math.random()*250}px;top:${-15+Math.random()*85}px;--bs:${1.4+Math.random()*2.2}s;--bsl:${Math.random()*2.5}s`;
    area.appendChild(sp);
  }
  /* 音符 */
  for(let i=0;i<10;i++){
    const note=document.createElement('div');
    note.className='fn';
    note.textContent=notes[Math.floor(Math.random()*notes.length)];
    const fs=14+Math.floor(Math.random()*12);
    note.style.cssText=`left:${5+Math.random()*190}px;top:${35+Math.random()*28}px;--fs:${fs}px;--nd:${2.2+Math.random()*3}s;--ndl:${Math.random()*3.5}s;--nr:${-25+Math.random()*50}deg`;
    nf.appendChild(note);
  }
})();

/* ===== 封印画面の光線 ===== */
(function(){
  const wrap=document.getElementById('rays');
  for(let i=0;i<16;i++){
    const r=document.createElement('div');
    r.className='ray';
    r.style.cssText=`transform:translate(-50%,-50%) rotate(${i*(360/16)}deg);animation-delay:${i*0.12}s`;
    wrap.appendChild(r);
  }
})();

/* ===== ぴかーんヘルパー ===== */
function pikan(el, duration=180, fadeOut=550){
  el.style.transition='none'; el.style.opacity='0';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.style.transition=`opacity 0.08s ease-in`; el.style.opacity='1';
      setTimeout(()=>{
        el.style.transition=`opacity ${fadeOut}ms ease-out`; el.style.opacity='0';
      }, duration);
    });
  });
}

/* ===== ガチャ開始 ===== */
function startGacha(){
  if(isAnimating)return;
  isAnimating=true;
  const btn=document.getElementById('gachaBtn');
  btn.disabled=true;
  currentResult=musicData[Math.floor(Math.random()*musicData.length)];
  pullCount++;
  document.getElementById('pullCount').textContent=pullCount;
  history.push(currentResult);

  const orbEl=document.getElementById('orb');
  const ambient=document.getElementById('orbAmbient');
  const cx=W/2, cy=H*0.5;

  /* 1) 震え + もわもわ */
  let shake=0;
  const shakeId=setInterval(()=>{
    shake++;
    const dx=(Math.random()-0.5)*10;
    const dy=(Math.random()-0.5)*4;
    orbEl.style.transform=`translate(${dx}px,${dy}px) scale(${1+Math.random()*0.05})`;
    ambient.style.background=`radial-gradient(circle,rgba(201,168,76,${0.12+Math.random()*0.22}) 35%,transparent 70%)`;
    if(shake%2===0) mistBurst(cx, cy+H*0.02, 6);
    if(shake>=22){clearInterval(shakeId);orbEl.style.transform='';}
  },75);

  /* 2) 0.7s: バーストその1 + ぴかーん */
  setTimeout(()=>{
    burst(cx,cy,60);
    mistBurst(cx,cy,10);
    addMeteor(); addMeteor();
    pikan(document.getElementById('pikanA'),200,600);
  },700);

  /* 3) 1.1s: バーストその2 */
  setTimeout(()=>{
    burst(cx,cy,50,1.2);
    addMeteor(); addMeteor(); addMeteor();
  },1100);

  /* 4) 1.6s: 封印画面へ */
  setTimeout(()=>{
    ambient.style.background='radial-gradient(circle,rgba(201,168,76,0) 40%,transparent 70%)';
    orbEl.style.transform='';
    burst(cx,cy,40);
    setTimeout(()=>{
      document.getElementById('sealScreen').classList.add('active');
      isAnimating=false;
      btn.disabled=false;
    },250);
  },1600);
}

/* ===== タップで解禁 ===== */
function doReveal(){
  const ss=document.getElementById('sealScreen');
  /* ぴかーん！ */
  pikan(document.getElementById('pikanB'),120,700);
  /* 全画面バースト */
  const cx=W/2,cy=H/2;
  for(let i=0;i<4;i++){
    setTimeout(()=>{
      burst(cx+(Math.random()-0.5)*W*0.5, cy+(Math.random()-0.5)*H*0.4, 55, 1.1);
      mistBurst(cx,cy,8);
    },i*70);
  }
  for(let i=0;i<4;i++) setTimeout(addMeteor, i*50);

  buildResult(currentResult);
  setTimeout(()=>{
    ss.classList.remove('active');
    document.getElementById('resultScreen').classList.add('active');
  },320);
}

function buildResult(p){
  document.getElementById('resultCard').innerHTML=`
    <div class="rc-intro">紹介者：${p.introducer}</div>
    <div class="rc-title">${p.title}</div>
    <div class="rc-composer">${p.composer}</div>
    <div class="rc-div"></div>
    <div class="rc-hl-label">Highlight</div>
    <div class="rc-hl">${p.highlight}</div>
    <a class="rc-yt" href="${p.youtube}" target="_blank" rel="noopener">▶ YouTube で試聴する</a>
  `;
}

function closeResult(){
  document.getElementById('resultScreen').classList.remove('active');
}

function showHistory(){
  if(!history.length){alert('まだ抽選していません');return;}
  alert('【過去の抽選】\n\n'+history.map((h,i)=>`${i+1}. ${h.title}\n   ${h.composer}`).join('\n\n'));
}
</script>
