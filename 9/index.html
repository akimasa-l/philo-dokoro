<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<title>Classical Gacha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    font-family:"Noto Serif JP", serif;
    background:
        radial-gradient(circle at top,#3d2a16 0%,#140d08 45%,#050303 100%);
    color:white;
    height:100vh;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* 背景 */

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.gold{
    position:absolute;
    width:2px;
    height:2px;
    background:#ffe6a3;
    border-radius:50%;
    opacity:0.7;
    animation:float 6s infinite ease-in-out;
}

@keyframes float{
    0%{
        transform:translateY(0px);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120px);
        opacity:0;
    }
}

/* UI */

.main{
    position:relative;
    z-index:10;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:24px;
}

.title{
    text-align:center;
    margin-top:30px;
}

.title h1{
    font-family:"Cinzel", serif;
    font-size:2.2rem;
    letter-spacing:5px;
    color:#ffe9b2;
    text-shadow:
        0 0 10px rgba(255,230,150,0.7),
        0 0 30px rgba(255,180,60,0.3);
}

.title p{
    margin-top:10px;
    opacity:0.8;
    font-size:0.9rem;
}

/* 本 */

.book-area{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.book{
    width:240px;
    height:320px;
    border-radius:12px;
    background:
        linear-gradient(135deg,#3d2613,#7a4c1d,#2b190d);
    position:relative;
    box-shadow:
        0 20px 50px rgba(0,0,0,0.7),
        inset 0 0 20px rgba(255,220,120,0.15);
    animation:idle 3s infinite ease-in-out;
}

.book::before{
    content:"";
    position:absolute;
    inset:12px;
    border:2px solid rgba(255,225,160,0.4);
    border-radius:8px;
}

.book::after{
    content:"♫";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:5rem;
    color:#ffe29c;
    text-shadow:0 0 20px rgba(255,230,150,0.6);
}

@keyframes idle{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* ボタン */

.buttons{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:30px;
}

button{
    border:none;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:1rem;
    font-weight:bold;
    font-family:"Noto Serif JP", serif;
}

button:active{
    transform:scale(0.96);
}

.pull{
    background:
        linear-gradient(135deg,#f2c46d,#9d5b18);
    box-shadow:
        0 8px 20px rgba(0,0,0,0.4),
        0 0 20px rgba(255,200,120,0.25);
}

.ten{
    background:
        linear-gradient(135deg,#ffdca8,#d47b2e,#7a350d);
}

/* 演出 */

.flash{
    position:absolute;
    inset:0;
    background:#fff7dd;
    opacity:0;
    pointer-events:none;
}

.flash.show{
    animation:flash 1s ease;
}

@keyframes flash{
    0%{
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:0;
    }
}

/* 結果 */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:100;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.card{
    width:84vw;
    max-width:340px;
    aspect-ratio:0.72;
    border-radius:24px;
    overflow:hidden;
    position:relative;
    transform:scale(0.7);
    opacity:0;
    transition:0.45s cubic-bezier(.15,.89,.32,1.45);
    box-shadow:
        0 20px 50px rgba(0,0,0,0.8),
        0 0 50px rgba(255,220,120,0.2);
}

.overlay.show .card{
    transform:scale(1);
    opacity:1;
}

.card-inner{
    position:absolute;
    inset:0;
    background:
        linear-gradient(to top,
            rgba(0,0,0,0.85) 0%,
            rgba(0,0,0,0.2) 50%,
            rgba(255,255,255,0.05) 100%);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:24px;
}

.rarity{
    font-size:0.95rem;
    letter-spacing:2px;
    opacity:0.85;
}

.name{
    font-size:2rem;
    margin-top:8px;
    font-weight:bold;
}

.piece{
    margin-top:10px;
    font-size:1rem;
    line-height:1.6;
    opacity:0.92;
}

.close{
    position:absolute;
    top:20px;
    right:20px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:1.1rem;
    backdrop-filter:blur(10px);
}

.rainbow{
    animation:rainbow 1s infinite linear;
}

@keyframes rainbow{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}
}

</style>
</head>

<body>

<div id="app">

    <div class="bg" id="bg"></div>

    <div class="main">

        <div class="title">
            <h1>SYMPHONIA</h1>
            <p>響きを召喚せよ</p>
        </div>

        <div class="book-area">
            <div class="book" id="book"></div>
        </div>

        <div class="buttons">
            <button class="pull" onclick="gacha(1)">
                楽曲召喚
            </button>

            <button class="ten" onclick="gacha(10)">
                10曲召喚
            </button>
        </div>

    </div>

    <div class="flash" id="flash"></div>

    <div class="overlay" id="overlay">

        <button class="close" onclick="closeCard()">✕</button>

        <div class="card" id="card">

            <div class="card-inner">

                <div class="rarity" id="rarity"></div>

                <div class="name" id="name"></div>

                <div class="piece" id="piece"></div>

            </div>

        </div>

    </div>

</div>

<script>

const songs = [

{
    rarity:"LEGEND",
    composer:"ベートーヴェン",
    piece:"交響曲第9番『歓喜の歌』",
    color:"linear-gradient(160deg,#fff0b3,#ffb347,#ff6b00)"
},

{
    rarity:"LEGEND",
    composer:"モーツァルト",
    piece:"レクイエム",
    color:"linear-gradient(160deg,#f7f7f7,#b8b8b8,#444)"
},

{
    rarity:"SSR",
    composer:"ショパン",
    piece:"幻想即興曲",
    color:"linear-gradient(160deg,#6d9eff,#203cff,#06154d)"
},

{
    rarity:"SSR",
    composer:"ヴィヴァルディ",
    piece:"『四季』より 春",
    color:"linear-gradient(160deg,#d4ff9a,#68d64f,#20651d)"
},

{
    rarity:"SR",
    composer:"ドビュッシー",
    piece:"月の光",
    color:"linear-gradient(160deg,#d7e6ff,#7da2ff,#334a8f)"
},

{
    rarity:"SR",
    composer:"バッハ",
    piece:"G線上のアリア",
    color:"linear-gradient(160deg,#ffe9c9,#d8a25c,#6b4021)"
},

{
    rarity:"R",
    composer:"パッヘルベル",
    piece:"カノン",
    color:"linear-gradient(160deg,#ddd,#888,#555)"
}

];

const flash = document.getElementById("flash");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");

const rarity = document.getElementById("rarity");
const nameEl = document.getElementById("name");
const piece = document.getElementById("piece");

function summon(){

    const r = Math.random();

    if(r < 0.03){
        return songs.filter(s => s.rarity === "LEGEND")
            [Math.floor(Math.random()*2)];
    }

    if(r < 0.18){
        return songs.filter(s => s.rarity === "SSR")
            [Math.floor(Math.random()*2)];
    }

    if(r < 0.50){
        return songs.filter(s => s.rarity === "SR")
            [Math.floor(Math.random()*2)];
    }

    return songs.find(s => s.rarity === "R");
}

function gacha(count){

    navigator.vibrate?.([100,50,120]);

    flash.classList.add("show");

    document.getElementById("book").classList.add("rainbow");

    setTimeout(() => {

        const result = summon();

        rarity.textContent = result.rarity;
        nameEl.textContent = result.composer;
        piece.textContent = result.piece;

        card.style.background = result.color;

        overlay.classList.add("show");

        if(result.rarity === "LEGEND"){
            navigator.vibrate?.([200,80,200,80,300]);
        }

    }, 900);

    setTimeout(() => {
        flash.classList.remove("show");
        document.getElementById("book").classList.remove("rainbow");
    }, 1200);
}

function closeCard(){
    overlay.classList.remove("show");
}

/* 背景パーティクル */

const bg = document.getElementById("bg");

for(let i=0;i<70;i++){

    const p = document.createElement("div");

    p.className = "gold";

    p.style.left = Math.random()*100 + "%";
    p.style.top = Math.random()*100 + "%";

    p.style.animationDelay = Math.random()*5 + "s";
    p.style.animationDuration = (4 + Math.random()*4) + "s";

    bg.appendChild(p);
}

</script>

</body>
</html>
